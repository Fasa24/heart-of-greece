<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Heart of Greece</title>
    <link rel="icon" href="../assets/icons/heart-of-greece-square-icon.png">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <script>
        try {
            if (JSON.parse(localStorage.getItem("theme")) === "dark")
                document.body.classList.add("dark-mode");
        } catch {}
    </script>
    
    <header class="header">
        <div class="header__brand">
            <img class="header__logo" src="../assets/icons/heart-of-greece-icon.png" width="80" height="auto" alt="HoG Icon">
            <div class="header__titles">
                <h1 class="header__title">Heart of Greece</h1>
                <h2 class="header__subtitle">Καρδιά της Ελλάδας</h2>
            </div>
        </div>

        <nav class="header__nav" aria-label="Main Navigation">
            <a class="header__link" href="../index.html" target="_self" rel="noopener" title="Home">Home</a>
            <a class="header__link" href="menu.html" target="_self" rel="noopener" title="Check our Menu">Menu</a>
            <a class="header__link" href="reservations.html" target="_self" rel="noopener" title="Come to the Table">Reservations</a>
            <a class="header__link" href="gallery.html" target="_self" rel="noopener" title="Meet Us">Gallery</a>
            <a class="header__link" href="contact.html" target="_self" rel="noopener" title="Contact Us">Contact</a>
            <button class="button-theme" id="button-theme" type="button" aria-pressed="false" aria-label="Toggle dark mode">🌙</button>
        </nav>
    </header>

    <main class="register">
        <h1 class="register__title">Create your Account</h1>
        <p class="register__subtitle">Register to book your table and save your favorite dishes.</p>

        <form class="form" id="register-form" action="#" method="POST" novalidate>

            <fieldset class="form__fieldset">
                <legend class="form__legend">Personal Information</legend>

                <div class="form__group">
                    <label class="form__label" for="fullName">Full Name:</label>
                    <input class="form__input" type="text" id="fullName" name="fullName" required minlength="3" placeholder="e.g. Socrates" autofocus>
                    <span class="form__error" id="fullName-error"></span>
                
                </div>

                <div class="form__group">
                    <label class="form__label" for="email">Email Address:</label>
                    <input class="form__input" type="email" id="email" name="email" required placeholder="email@example.com">
                    <span class="form__error" id="email-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="phone">Phone Number:</label>
                    <input class="form__input" type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="2112345678" aria-describedby="phone-help">
                    <small class="form__help" id="phone-help">Enter 10 digits without spaces or special characters (e.g., 2112345678).</small>
                    <span class="form__error" id="phone-error"></span>
                </div>
            </fieldset>

            <fieldset class="form__fieldset">
                <legend class="form__legend">Restaurant Preferences</legend>

                <div class="form__group">
                    <label class="form__label" for="diet">Dietary Preference:</label>
                    <select class="form__select" id="diet" name="diet">
                        <option value="none" selected>None</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="vegan">Vegan</option>
                        <option value="gluten-free">Gluten-Free</option>
                        <option value="nut-allergy">Nut Allergy</option>
                    </select>
                    <span class="form__error" id="diet-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="favoriteDish">Favorite Greek Dish (Optional):</label>
                    <input class="form__input" type="text" id="favoriteDish" name="favoriteDish" list="dish-list" placeholder="Choose or type one">
                    <span class="form__error" id="favoriteDish-error"></span>
                    <datalist id="dish-list">
                        <option value="Classic Moussaka"></option>
                        <option value="Chicken Souvlaki"></option>
                        <option value="Baklava"></option>
                    </datalist>
                    
                </div>
            </fieldset>

            <div class="form__actions">
                <button class="form__button form__button--submit" type="submit">Create Account</button>
                <button class="form__button form__button--reset" type="reset">Clear Form</button>
            </div>
            <p id="register-success" class="form__success" aria-live="polite"></p>

        </form>
    </main>
    <script type="module" src="../js/register.js" defer></script>
    <script src="../js/theme.js" defer></script>
</body>
</html>
